# roles/opsmanager_tenant/tasks/per_tenant.yml
---
- name: "[{{ tenant.name }}] Create Ops Manager credentials secret in tenant namespace"
  k8s:
    state: present
    context: "{{ kube_context | default(omit) }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "om-{{ tenant.name }}-credentials"
        namespace: "{{ tenant.namespace }}"
      type: Opaque
      stringData:
        # Use ONE global programmatic key for all tenants.
        # MCK will use this to create/manage projects & deployments.
        user: "{{ ops_manager_global_public_key }}"
        publicApiKey: "{{ ops_manager_global_private_key }}"

- name: "[{{ tenant.name }}] Create Ops Manager project ConfigMap in tenant namespace"
  k8s:
    state: present
    context: "{{ kube_context | default(omit) }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "om-{{ tenant.name }}-project"
        namespace: "{{ tenant.namespace }}"
      data:
        baseUrl: "{{ ops_manager_url }}"
        projectName: "{{ tenant.project_name }}"
        # orgId optional for some versions; useful for MCK hints
        orgId: "{{ ops_manager_org_id }}"