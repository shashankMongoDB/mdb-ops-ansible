---
# For each tenant, create:
# - Secret: om-<tenant>-credentials (global OM key)
# - ConfigMap: om-<tenant>-project (baseUrl + projectName)
# MCK will create the OM project the first time a MongoDB CR references this.

- name: Configure per-tenant ConfigMap/Secret for MCK + Ops Manager
  include_tasks: per_tenant.yml
  loop: "{{ tenants }}"
  loop_control:
    loop_var: tenant