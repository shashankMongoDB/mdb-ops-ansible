apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: mdbaas-control-plane
type: Opaque
stringData:
  # Control Plane MongoDB Connection
  MCP_MONGODB_URI: "mongodb://username:password@mongodb-host:27017/?authSource=admin"
  
  # Ops Manager Credentials
  MCP_OPS_MANAGER_URL: "http://ops-manager-host:8080"
  MCP_OPS_MANAGER_ORG: "your-org-id"
  MCP_OM_GLOBAL_PUBLIC_KEY: "your-public-key"
  MCP_OM_GLOBAL_PRIVATE_KEY: "your-private-key"
  
  # AWS Credentials (for non-EKS environments)
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  
  # IRSA Role ARN (for EKS)
  COMMUNITY_BACKUP_IRSA_ROLE_ARN: "arn:aws:iam::123456789012:role/mdbaas-community-backup-s3-irsa"
