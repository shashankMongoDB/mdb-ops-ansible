apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mdbaas-control-plane
  labels:
    app: mdbaas-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mdbaas-frontend
  template:
    metadata:
      labels:
        app: mdbaas-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/mdbaas-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mdbaas-control-plane
  labels:
    app: mdbaas-frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: mdbaas-frontend
