apiVersion: v1
kind: ServiceAccount
metadata:
  name: mdbaas-backend-sa
  namespace: mdbaas-control-plane
  labels:
    app: mdbaas-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mdbaas-backend-role
rules:
# MongoDB Enterprise Operator CRDs
- apiGroups: ["mongodb.com"]
  resources: ["mongodb", "mongodbusers", "opsmanagers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# MongoDB Community Operator CRDs
- apiGroups: ["mongodbcommunity.mongodb.com"]
  resources: ["mongodbcommunity"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Core resources
- apiGroups: [""]
  resources: ["namespaces", "secrets", "configmaps", "services", "pods", "pods/exec", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Apps resources
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Batch resources (for backup CronJobs)
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# RBAC resources
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Network policies
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Nodes (for getting worker node IPs)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]

# ServiceAccounts
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mdbaas-backend-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mdbaas-backend-role
subjects:
- kind: ServiceAccount
  name: mdbaas-backend-sa
  namespace: mdbaas-control-plane
