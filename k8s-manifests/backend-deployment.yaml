apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mdbaas-control-plane
  labels:
    app: mdbaas-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mdbaas-backend
  template:
    metadata:
      labels:
        app: mdbaas-backend
        tier: backend
    spec:
      serviceAccountName: mdbaas-backend-sa
      containers:
      - name: backend
        image: your-registry/mdbaas-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: kubeconfig
          mountPath: /root/.kube
          readOnly: true
      volumes:
      - name: kubeconfig
        secret:
          secretName: kubeconfig-secret
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mdbaas-control-plane
  labels:
    app: mdbaas-backend
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: mdbaas-backend
