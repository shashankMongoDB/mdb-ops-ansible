version: '3.8'

services:
  # Backend FastAPI Service
  backend:
    build:
      context: ./AtlasForge
      dockerfile: Dockerfile
    container_name: mdbaas-backend
    ports:
      - "8001:8001"
    env_file:
      - ./AtlasForge/.env
    volumes:
      # Mount kubeconfig if running outside cluster
      - ~/.kube/config:/root/.kube/config:ro
    restart: unless-stopped
    networks:
      - mdbaas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Vite + React Service
  frontend:
    build:
      context: ./AtlasForge-UI-Vite
      dockerfile: Dockerfile
    container_name: mdbaas-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mdbaas-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mdbaas-network:
    driver: bridge
