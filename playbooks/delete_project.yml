---
- name: Delete Project from Ops Manager
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars_prompt:
    - name: project_id
      prompt: "Enter the Project ID to delete"
      private: false
    - name: confirm_delete
      prompt: "Are you sure? Type 'yes' to confirm deletion"
      private: false

  tasks:
    - name: Validate confirmation
      ansible.builtin.assert:
        that:
          - confirm_delete == "yes"
        fail_msg: "Deletion not confirmed. Aborting."

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
          - project_id is defined
        fail_msg: "Required variables missing"

    - name: Get project details before deletion
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/groups/{{ project_id }}"
        method: GET
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: true
      register: project_details
      ignore_errors: yes

    - name: Display project details
      ansible.builtin.debug:
        msg:
          - "Project to delete:"
          - "  Name: {{ project_details.json.name }}"
          - "  ID: {{ project_details.json.id }}"
          - "  Org ID: {{ project_details.json.orgId }}"
          - "  Replica Sets: {{ project_details.json.replicaSetCount }}"
          - "  Shards: {{ project_details.json.shardCount }}"
      when: project_details.status == 200

    - name: Check if project has deployments
      ansible.builtin.assert:
        that:
          - project_details.json.replicaSetCount == 0
          - project_details.json.shardCount == 0
        fail_msg: |
          ERROR: Cannot delete project with active deployments!
          Replica Sets: {{ project_details.json.replicaSetCount }}
          Shards: {{ project_details.json.shardCount }}
          
          You must delete all clusters first before deleting the project.
      when: project_details.status == 200

    - name: Delete the project
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/groups/{{ project_id }}"
        method: DELETE
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: [200, 204]
        return_content: true
      register: delete_result

    - name: Display deletion result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Project deleted successfully!"
          - "Project ID: {{ project_id }}"
          - "Project Name: {{ project_details.json.name | default('N/A') }}"
          - ""
          - "IMPORTANT:"
          - "- All monitoring data for this project has been removed"
          - "- The project no longer appears in selection lists"
          - "- This action cannot be undone"
          - "=========================================="
