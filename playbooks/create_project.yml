---
- name: Create MongoDB Ops Manager Project
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  vars_prompt:
    - name: org_id_input
      prompt: "Enter the Organization ID"
      private: false
    - name: project_name
      prompt: "Enter the project name"
      private: false

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
          - org_id_input is defined
          - org_id_input | length > 0
        fail_msg: "Please provide valid Organization ID and ensure ops_manager credentials are configured in group_vars/all.yml"

    - name: Prepare project creation payload
      ansible.builtin.set_fact:
        project_payload:
          name: "{{ project_name }}"
          orgId: "{{ org_id_input }}"

    - name: Create project in Ops Manager
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/groups"
        method: POST
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body: "{{ project_payload | to_json }}"
        body_format: json
        status_code: 201
        return_content: true
      register: project_result

    - name: Display project creation result (on console)
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "PROJECT CREATED SUCCESSFULLY!"
          - "=========================================="
          - ""
          - "Project Details:"
          - "  Project ID: {{ project_result.json.id }}"
          - "  Project Name: {{ project_result.json.name }}"
          - "  Organization ID: {{ project_result.json.orgId }}"
          - ""
          - "Agent API Key (SAVE THIS!):"
          - "  {{ project_result.json.agentApiKey }}"
          - ""
          - "=========================================="

    - name: Save project details to file
      ansible.builtin.copy:
        content: |
          Project Details:
          ================
          Project ID: {{ project_result.json.id }}
          Project Name: {{ project_result.json.name }}
          Agent API Key: {{ project_result.json.agentApiKey }}
          Organization ID: {{ project_result.json.orgId }}
          Created: {{ ansible_date_time.iso8601 }}
          
          Full Response:
          {{ project_result.json | to_nice_json }}
        dest: "./project_{{ project_result.json.id }}_details.txt"
      delegate_to: localhost

    - name: Next Steps Summary
      ansible.builtin.debug:
        msg:
          - ""
          - "IMPORTANT - NEXT STEPS:"
          - "=========================================="
          - ""
          - "1. Make this project visible in dashboard:"
          - "   a) Get your User ID:"
          - "      ansible-playbook playbooks/get_user_id.yml"
          - ""
          - "   b) Add yourself to project:"
          - "      ansible-playbook playbooks/add_user_to_project.yml"
          - "      (Use Project ID: {{ project_result.json.id }})"
          - ""
          - "2. Project details saved to:"
          - "   ./project_{{ project_result.json.id }}_details.txt"
          - ""
          - "3. Ready for next steps:"
          - "   - Install MongoDB agents on VMs"
          - "   - Deploy MongoDB cluster"
          - ""
          - "=========================================="
