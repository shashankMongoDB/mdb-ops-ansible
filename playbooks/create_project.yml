---
- name: Create MongoDB Ops Manager Project
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: project_name
      prompt: "Enter the project name"
      private: false
    - name: project_tags
      prompt: "Enter project tags (comma-separated, optional)"
      private: false
      default: ""

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
          - ops_manager_org_id is defined
          - ops_manager_org_id != "YOUR_ORG_ID_HERE"
        fail_msg: "Please configure ops_manager credentials and org_id in group_vars/all.yml"

    - name: Parse tags into list
      ansible.builtin.set_fact:
        project_tags_list: "{{ project_tags.split(',') | map('trim') | select() | list }}"
      when: project_tags | length > 0

    - name: Prepare project creation payload
      ansible.builtin.set_fact:
        project_payload:
          name: "{{ project_name }}"
          orgId: "{{ ops_manager_org_id }}"
          tags: "{{ project_tags_list | default([]) }}"

    - name: Create project in Ops Manager
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/groups"
        method: POST
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body: "{{ project_payload | to_json }}"
        body_format: json
        status_code: 201
        return_content: true
      register: project_result

    - name: Display project creation result
      ansible.builtin.debug:
        msg:
          - "Project created successfully!"
          - "Project ID: {{ project_result.json.id }}"
          - "Project Name: {{ project_result.json.name }}"
          - "Agent API Key: {{ project_result.json.agentApiKey }}"
          - "Organization ID: {{ project_result.json.orgId }}"

    - name: Save project details to file
      ansible.builtin.copy:
        content: |
          Project Details:
          ================
          Project ID: {{ project_result.json.id }}
          Project Name: {{ project_result.json.name }}
          Agent API Key: {{ project_result.json.agentApiKey }}
          Organization ID: {{ project_result.json.orgId }}
          Created: {{ ansible_date_time.iso8601 }}
          
          Full Response:
          {{ project_result.json | to_nice_json }}
        dest: "./project_{{ project_result.json.id }}_details.txt"
      delegate_to: localhost

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Project '{{ project_name }}' created successfully"
          - "Project ID: {{ project_result.json.id }}"
          - "Save this Project ID for future operations"
          - "Details saved to: ./project_{{ project_result.json.id }}_details.txt"
          - "=========================================="
