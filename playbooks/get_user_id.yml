---
- name: Get User ID by Username or Email
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars_prompt:
    - name: username_or_email
      prompt: "Enter username or email address"
      private: false

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
        fail_msg: "Please configure ops_manager credentials in group_vars/all.yml"

    - name: Get user by username
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/users/byName/{{ username_or_email }}"
        method: GET
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: [200, 404]
        return_content: true
      register: user_result

    - name: Display user information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "User Found!"
          - "=========================================="
          - "User ID: {{ user_result.json.id }}"
          - "Username: {{ user_result.json.username }}"
          - "Email: {{ user_result.json.emailAddress }}"
          - "First Name: {{ user_result.json.firstName }}"
          - "Last Name: {{ user_result.json.lastName }}"
          - ""
          - "Current Roles:"
          - "{{ user_result.json.roles | to_nice_yaml }}"
          - ""
          - "Copy this User ID to use in add_user_to_org.yml or add_user_to_project.yml"
          - "=========================================="
      when: user_result.status == 200

    - name: User not found
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "User not found: {{ username_or_email }}"
          - ""
          - "Please verify:"
          - "- The username/email is correct"
          - "- The user exists in Ops Manager"
          - "- You have permission to view this user"
          - "=========================================="
      when: user_result.status == 404
