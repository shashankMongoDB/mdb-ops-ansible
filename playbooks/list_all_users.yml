---
- name: List All Users in Ops Manager
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
        fail_msg: "Please configure ops_manager credentials in group_vars/all.yml"

    - name: Get all users in Ops Manager
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/users"
        method: GET
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: true
      register: users_result

    - name: Display all users
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "ALL USERS IN OPS MANAGER"
          - "=========================================="
          - ""
          - "Total Users: {{ users_result.json.totalCount }}"
          - ""
          - "{% for user in users_result.json.results %}"
          - "User {{ loop.index }}:"
          - "  User ID: {{ user.id }}"
          - "  Username: {{ user.username }}"
          - "  Email: {{ user.emailAddress }}"
          - "  First Name: {{ user.firstName }}"
          - "  Last Name: {{ user.lastName }}"
          - "  Roles: {{ user.roles | length }} role(s)"
          - "  ---"
          - "{% endfor %}"
          - ""
          - "=========================================="
          - "IMPORTANT:"
          - "Find YOUR login username above"
          - "Copy the User ID for that username"
          - "Then run: ansible-playbook playbooks/add_user_to_org.yml --ask-vault-pass"
          - "=========================================="

    - name: Save users list to file
      ansible.builtin.copy:
        content: |
          All Ops Manager Users
          =====================
          Generated: {{ ansible_date_time.iso8601 }}
          Total Users: {{ users_result.json.totalCount }}
          
          {% for user in users_result.json.results %}
          User {{ loop.index }}:
          --------
          User ID: {{ user.id }}
          Username: {{ user.username }}
          Email: {{ user.emailAddress }}
          First Name: {{ user.firstName }}
          Last Name: {{ user.lastName }}
          
          Roles:
          {{ user.roles | to_nice_yaml }}
          
          {% endfor %}
        dest: "./all_users_list.txt"
      delegate_to: localhost

    - name: Final instructions
      ansible.builtin.debug:
        msg:
          - ""
          - "User list saved to: ./all_users_list.txt"
          - ""
          - "Next Steps:"
          - "1. Find YOUR login username from the list above"
          - "2. Copy that user's ID"
          - "3. Run: ansible-playbook playbooks/add_user_to_org.yml --ask-vault-pass"
          - "4. Enter the Organization ID and your User ID"
          - "5. Choose role: ORG_OWNER"
          - "6. Refresh your Ops Manager dashboard"
