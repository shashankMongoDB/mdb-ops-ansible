---
- name: List All Users in Organization
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  vars_prompt:
    - name: org_id
      prompt: "Enter the Organization ID"
      private: false

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
          - org_id is defined
          - org_id | length > 0
        fail_msg: "Please configure ops_manager credentials and provide org_id"

    - name: Get all users in organization
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/orgs/{{ org_id }}/users"
        method: GET
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: true
      register: users_result

    - name: Display all users
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "ALL USERS IN ORGANIZATION"
          - "=========================================="
          - ""
          - "Organization ID: {{ org_id }}"
          - "Total Users: {{ users_result.json.totalCount }}"
          - ""
          - "{% for user in users_result.json.results %}"
          - "User {{ loop.index }}:"
          - "  User ID: {{ user.id }}"
          - "  Username: {{ user.username }}"
          - "  Email: {{ user.emailAddress }}"
          - "  First Name: {{ user.firstName }}"
          - "  Last Name: {{ user.lastName }}"
          - "  Roles in this org: {{ user.roles | selectattr('orgId', 'defined') | list | length }} role(s)"
          - "  ---"
          - "{% endfor %}"
          - ""
          - "=========================================="
          - "IMPORTANT:"
          - "If you DON'T see your username above, it means:"
          - "  - Your user is NOT in this organization yet"
          - "  - You need to add it using: add_user_to_org.yml"
          - ""
          - "If you SEE your username:"
          - "  - Copy the User ID"
          - "  - The org should be visible in your dashboard"
          - "  - If not, check your role (should be ORG_OWNER)"
          - "=========================================="

    - name: Save users list to file
      ansible.builtin.copy:
        content: |
          Users in Organization {{ org_id }}
          ===================================
          Generated: {{ ansible_date_time.iso8601 }}
          Total Users: {{ users_result.json.totalCount }}
          
          {% for user in users_result.json.results %}
          User {{ loop.index }}:
          --------
          User ID: {{ user.id }}
          Username: {{ user.username }}
          Email: {{ user.emailAddress }}
          First Name: {{ user.firstName }}
          Last Name: {{ user.lastName }}
          
          Roles:
          {{ user.roles | to_nice_yaml }}
          
          {% endfor %}
        dest: "./org_{{ org_id }}_users.txt"
      delegate_to: localhost

    - name: Final instructions
      ansible.builtin.debug:
        msg:
          - ""
          - "User list saved to: ./org_{{ org_id }}_users.txt"
          - ""
          - "What to do next:"
          - ""
          - "IF your username is NOT in the list above:"
          - "  1. Find YOUR login username (check top-right of dashboard)"
          - "  2. Get your User ID: ansible-playbook playbooks/get_user_id.yml --ask-vault-pass"
          - "  3. Add yourself to org: ansible-playbook playbooks/add_user_to_org.yml --ask-vault-pass"
          - "  4. Choose role: ORG_OWNER"
          - ""
          - "IF your username IS in the list above:"
          - "  1. Check if you have ORG_OWNER role"
          - "  2. If not, run add_user_to_org.yml again with ORG_OWNER"
          - "  3. Refresh your dashboard - org should be visible"
