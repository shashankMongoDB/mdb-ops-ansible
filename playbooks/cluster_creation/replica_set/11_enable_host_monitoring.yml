---
- name: Enable Monitoring on Each Host
  hosts: localhost
  gather_facts: no

  vars:
    ops_manager_url: "{{ lookup('env', 'OPS_MANAGER_URL') }}"
    ops_manager_project_id: "{{ lookup('env', 'OPS_MANAGER_PROJECT_ID') }}"

  tasks:
    - name: Get all hosts from Ops Manager
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/v1.0/groups/{{ ops_manager_project_id }}/hosts"
        method: GET
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: hosts_status

    - name: Display current hosts status
      ansible.builtin.debug:
        msg: "Found {{ hosts_status.json.results | length }} hosts: {{ hosts_status.json.results | map(attribute='hostname') | list }}"

    - name: Enable monitoring on each host
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/v1.0/groups/{{ ops_manager_project_id }}/hosts/{{ item.id }}"
        method: PATCH
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body:
          alertsEnabled: true
          logsEnabled: true
          profilerEnabled: false
        body_format: json
        status_code: [200, 201]
        return_content: yes
      loop: "{{ hosts_status.json.results }}"
      register: enable_result

    - name: Display enable results
      ansible.builtin.debug:
        msg: "Enabled monitoring on {{ item.json.hostname }}: logs={{ item.json.logsEnabled }}, alerts={{ item.json.alertsEnabled }}"
      loop: "{{ enable_result.results }}"

    - name: Wait for monitoring to activate
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting 30 seconds for monitoring agents to start collecting data..."

    - name: Check hosts status again
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/v1.0/groups/{{ ops_manager_project_id }}/hosts"
        method: GET
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: updated_hosts_status

    - name: Display final monitoring status
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "FINAL MONITORING STATUS"
          - "=========================================="
          - "{{ updated_hosts_status.json.results | map(attribute='hostname') | list | join(', ') }}"
          - ""
          - "Types: {{ updated_hosts_status.json.results | map(attribute='typeName') | list }}"
          - ""
          - "Check Ops Manager UI: http://ec2-35-88-225-248.us-west-2.compute.amazonaws.com:8080"
          - "Navigate to: Deployment → Servers"
          - ""
          - "If still NO_DATA, wait 5-10 minutes for metrics to appear"
          - "=========================================="
