---
- name: Deploy MongoDB Replica Set with Authentication and Monitoring
  hosts: localhost
  gather_facts: yes

  vars:
    automation_config_file: "/tmp/automation_config.json"
    current_config_file: "/tmp/current_automation_config.json"

  tasks:
    - name: Display deployment start
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "MongoDB Replica Set Deployment"
          - "=========================================="
          - "Cluster Type: 3-Node Replica Set"
          - "MongoDB Version: {{ hostvars[groups['all'][0]]['mongodb_version'] }}"
          - "Replica Set: {{ hostvars[groups['all'][0]]['replica_set_name'] }}"
          - "Authentication: {{ hostvars[groups['all'][0]]['enable_authentication'] }}"
          - "Monitoring: {{ hostvars[groups['all'][0]]['enable_monitoring'] }}"
          - ""
          - "Nodes:"
          - "  - {{ hostvars[groups['mongodb_primary'][0]]['ansible_host'] }} (Primary)"
          - "  - {{ hostvars[groups['mongodb_secondary'][0]]['ansible_host'] }} (Secondary)"
          - "  - {{ hostvars[groups['mongodb_secondary'][1]]['ansible_host'] }} (Secondary)"
          - ""

    # ============================================
    # STEP 1: API Access List Whitelisting
    # ============================================
    
    - name: Get control node IP address
      ansible.builtin.shell: |
        hostname -I | awk '{print $1}'
      register: control_node_ip
      changed_when: false

    - name: Display control node IP
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Step 1: API Access List Whitelisting"
          - "=========================================="
          - "Control Node IP: {{ control_node_ip.stdout }}"
          - "This IP needs API access to Ops Manager"

    - name: Check current global access list
      ansible.builtin.uri:
        url: "{{ hostvars[groups['all'][0]]['ops_manager_url'] }}/api/public/v1.0/admin/accessList"
        method: GET
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: [200, 403]
        return_content: yes
      register: current_access_list
      ignore_errors: yes

    - name: Display current access list status
      ansible.builtin.debug:
        msg:
          - "Current access list status: {{ 'Retrieved' if current_access_list.status == 200 else 'Access denied (will add IP)' }}"
          - "Status code: {{ current_access_list.status }}"
      when: current_access_list is defined

    - name: Add control node IP to global access list
      ansible.builtin.uri:
        url: "{{ hostvars[groups['all'][0]]['ops_manager_url'] }}/api/public/v1.0/admin/accessList"
        method: POST
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          ipAddress: "{{ control_node_ip.stdout }}"
          cidrBlock: "{{ control_node_ip.stdout }}/32"
        status_code: [200, 201, 409, 403]
        return_content: yes
      register: add_ip_result
      ignore_errors: yes

    - name: Display IP whitelist result
      ansible.builtin.debug:
        msg:
          - "IP Whitelist Result:"
          - "  Status: {{ 'Success' if add_ip_result.status in [200, 201] else 'Already exists' if add_ip_result.status == 409 else 'Failed' }}"
          - "  IP Added: {{ control_node_ip.stdout }}/32"
          - "  Note: If status is 409, IP is already whitelisted"

    - name: Wait for access list propagation
      ansible.builtin.pause:
        seconds: 5
        prompt: "Waiting 5 seconds for API access list to propagate..."
      when: add_ip_result.status in [200, 201]

    - name: Verify API access
      ansible.builtin.uri:
        url: "{{ hostvars[groups['all'][0]]['ops_manager_url'] }}/api/public/v1.0/groups/{{ hostvars[groups['all'][0]]['ops_manager_project_id'] }}/automationConfig"
        method: GET
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: verify_access

    - name: Display API access verification
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "API Access Verified Successfully!"
          - "=========================================="
          - "Control node can now access Ops Manager API"
          - ""

    # ============================================
    # STEP 2: Generate Keyfile and Deploy
    # ============================================

    - name: Generate MongoDB keyfile for authentication
      ansible.builtin.shell: |
        openssl rand -base64 756
      register: keyfile_content
      when: hostvars[groups['all'][0]]['enable_authentication'] | bool

    - name: Display keyfile generated
      ansible.builtin.debug:
        msg: "MongoDB keyfile generated ({{ keyfile_content.stdout | length }} characters)"
      when: hostvars[groups['all'][0]]['enable_authentication'] | bool

    - name: Get current automation config
      ansible.builtin.uri:
        url: "{{ hostvars[groups['all'][0]]['ops_manager_url'] }}/api/public/{{ hostvars[groups['all'][0]]['ops_manager_api_version'] | default('v1.0') }}/groups/{{ hostvars[groups['all'][0]]['ops_manager_project_id'] }}/automationConfig"
        method: GET
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: current_config

    - name: Save current config to file
      ansible.builtin.copy:
        content: "{{ current_config.json | to_nice_json }}"
        dest: "{{ current_config_file }}"

    - name: Display current config version
      ansible.builtin.debug:
        msg: "Current automation config version: {{ current_config.json.version }}"

    - name: Build replica set automation config
      ansible.builtin.template:
        src: templates/replica_set_config_secure.j2
        dest: "{{ automation_config_file }}"
      vars:
        config_version: "{{ current_config.json.version }}"
        keyfile_base64: "{{ keyfile_content.stdout | b64encode }}"
        mongodb_version: "{{ hostvars[groups['all'][0]]['mongodb_version'] }}"
        replica_set_name: "{{ hostvars[groups['all'][0]]['replica_set_name'] }}"
        enable_auth: "{{ hostvars[groups['all'][0]]['enable_authentication'] }}"
        enable_monitoring: "{{ hostvars[groups['all'][0]]['enable_monitoring'] }}"
        
        # Node 1 (Primary candidate)
        node1_name: "{{ groups['mongodb_primary'][0] }}"
        node1_hostname: "{{ hostvars[groups['mongodb_primary'][0]]['ansible_host'] }}"
        node1_priority: "{{ hostvars[groups['mongodb_primary'][0]]['priority'] }}"
        node1_member_id: "{{ hostvars[groups['mongodb_primary'][0]]['member_id'] }}"
        
        # Node 2 (Secondary)
        node2_name: "{{ groups['mongodb_secondary'][0] }}"
        node2_hostname: "{{ hostvars[groups['mongodb_secondary'][0]]['ansible_host'] }}"
        node2_priority: "{{ hostvars[groups['mongodb_secondary'][0]]['priority'] }}"
        node2_member_id: "{{ hostvars[groups['mongodb_secondary'][0]]['member_id'] }}"
        
        # Node 3 (Secondary)
        node3_name: "{{ groups['mongodb_secondary'][1] }}"
        node3_hostname: "{{ hostvars[groups['mongodb_secondary'][1]]['ansible_host'] }}"
        node3_priority: "{{ hostvars[groups['mongodb_secondary'][1]]['priority'] }}"
        node3_member_id: "{{ hostvars[groups['mongodb_secondary'][1]]['member_id'] }}"

    - name: Display automation config preview
      ansible.builtin.shell: |
        head -50 {{ automation_config_file }}
      register: config_preview

    - name: Show config preview
      ansible.builtin.debug:
        msg: "{{ config_preview.stdout_lines }}"

    - name: Update automation config via API
      ansible.builtin.uri:
        url: "{{ hostvars[groups['all'][0]]['ops_manager_url'] }}/api/public/{{ hostvars[groups['all'][0]]['ops_manager_api_version'] | default('v1.0') }}/groups/{{ hostvars[groups['all'][0]]['ops_manager_project_id'] }}/automationConfig"
        method: PUT
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body: "{{ lookup('file', automation_config_file) }}"
        body_format: json
        status_code: [200, 201]
        return_content: yes
      register: update_result

    - name: Display update result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Automation Config Updated!"
          - "=========================================="
          - "New Version: {{ update_result.json.version }}"
          - ""
          - "Deployment in progress..."
          - "Agents will now:"
          - "  1. Download MongoDB {{ hostvars[groups['all'][0]]['mongodb_version'] }}"
          - "  2. Place keyfile on each node"
          - "  3. Start mongod processes"
          - "  4. Initialize replica set"
          - ""
          - "This will take 5-10 minutes..."
          - ""

    - name: Wait for deployment to reach goal state
      ansible.builtin.uri:
        url: "{{ hostvars[groups['mongodb_all'][0]]['ops_manager_url'] }}/api/public/{{ hostvars[groups['mongodb_all'][0]]['ops_manager_api_version'] | default('v1.0') }}/groups/{{ hostvars[groups['mongodb_all'][0]]['ops_manager_project_id'] }}/automationStatus"
        method: GET
        user: "{{ lookup('env', 'OPS_MANAGER_PUBLIC_KEY') }}"
        password: "{{ lookup('env', 'OPS_MANAGER_PRIVATE_KEY') }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: automation_status
      until: automation_status.json.goalVersion == automation_status.json.lastGoalVersionAchieved
      retries: 60
      delay: 10

    - name: Display deployment complete
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "REPLICA SET DEPLOYMENT COMPLETE!"
          - "=========================================="
          - ""
          - "Status: SUCCESS"
          - "Goal Version: {{ automation_status.json.goalVersion }}"
          - "Achieved Version: {{ automation_status.json.lastGoalVersionAchieved }}"
          - ""
          - "Replica Set: {{ hostvars[groups['all'][0]]['replica_set_name'] }}"
          - "Members:"
          - "  - {{ hostvars[groups['mongodb_primary'][0]]['ansible_host'] }}:27017 (PRIMARY)"
          - "  - {{ hostvars[groups['mongodb_secondary'][0]]['ansible_host'] }}:27017 (SECONDARY)"
          - "  - {{ hostvars[groups['mongodb_secondary'][1]]['ansible_host'] }}:27017 (SECONDARY)"
          - ""
          - "Authentication: {{ 'ENABLED' if hostvars[groups['all'][0]]['enable_authentication'] | bool else 'DISABLED' }}"
          - "Monitoring: {{ 'ENABLED' if hostvars[groups['all'][0]]['enable_monitoring'] | bool else 'DISABLED' }}"
          - ""
          - "Next Steps:"
          - "1. Create admin user: ansible-playbook 3_create_admin_user.yml"
          - "2. Or verify now: ansible-playbook 5_verify_complete.yml"
          - "=========================================="

    - name: Save deployment details
      ansible.builtin.copy:
        content: |
          MongoDB Replica Set Deployment Complete
          ==========================================
          Timestamp: {{ ansible_date_time.iso8601 }}
          
          Replica Set: {{ hostvars[groups['all'][0]]['replica_set_name'] }}
          MongoDB Version: {{ hostvars[groups['all'][0]]['mongodb_version'] }}
          
          Nodes:
            Primary:   {{ hostvars[groups['mongodb_primary'][0]]['ansible_host'] }}:27017
            Secondary: {{ hostvars[groups['mongodb_secondary'][0]]['ansible_host'] }}:27017
            Secondary: {{ hostvars[groups['mongodb_secondary'][1]]['ansible_host'] }}:27017
          
          Connection String (without auth):
          mongodb://{{ hostvars[groups['mongodb_primary'][0]]['ansible_host'] }}:27017,{{ hostvars[groups['mongodb_secondary'][0]]['ansible_host'] }}:27017,{{ hostvars[groups['mongodb_secondary'][1]]['ansible_host'] }}:27017/?replicaSet={{ hostvars[groups['all'][0]]['replica_set_name'] }}
          
          Authentication: {{ 'ENABLED' if hostvars[groups['all'][0]]['enable_authentication'] | bool else 'DISABLED' }}
          Monitoring: {{ 'ENABLED' if hostvars[groups['all'][0]]['enable_monitoring'] | bool else 'DISABLED' }}
          
          Next: Create admin user with 3_create_admin_user.yml
        dest: "./deployment_{{ hostvars[groups['all'][0]]['replica_set_name'] }}_{{ ansible_date_time.epoch }}.txt"
