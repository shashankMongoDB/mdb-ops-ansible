# MongoDB Replica Set Inventory (YAML Format)
# All values read from environment variables (.env file)
# 
# Load environment first:
#   source ../load_env.sh
#
# Then use this inventory:
#   ansible -i inventory.yml mongodb_all -m ping

all:
  children:
    mongodb_primary:
      hosts:
        mongodb-01:
          ansible_host: "{{ lookup('env', 'VM1_IP') | default('172.31.16.76', true) }}"
          priority: "{{ lookup('env', 'VM1_PRIORITY') | default('2', true) | int }}"
          member_id: "{{ lookup('env', 'VM1_MEMBER_ID') | default('0', true) | int }}"
          hostname: "{{ lookup('env', 'VM1_HOSTNAME') | default('mongodb-01', true) }}"

    mongodb_secondary:
      hosts:
        mongodb-02:
          ansible_host: "{{ lookup('env', 'VM2_IP') | default('172.31.21.74', true) }}"
          priority: "{{ lookup('env', 'VM2_PRIORITY') | default('1', true) | int }}"
          member_id: "{{ lookup('env', 'VM2_MEMBER_ID') | default('1', true) | int }}"
          hostname: "{{ lookup('env', 'VM2_HOSTNAME') | default('mongodb-02', true) }}"
        
        mongodb-03:
          ansible_host: "{{ lookup('env', 'VM3_IP') | default('172.31.23.234', true) }}"
          priority: "{{ lookup('env', 'VM3_PRIORITY') | default('1', true) | int }}"
          member_id: "{{ lookup('env', 'VM3_MEMBER_ID') | default('2', true) | int }}"
          hostname: "{{ lookup('env', 'VM3_HOSTNAME') | default('mongodb-03', true) }}"

    mongodb_all:
      children:
        - mongodb_primary
        - mongodb_secondary
      
      vars:
        # SSH Configuration
        ansible_user: "{{ lookup('env', 'SSH_USER') | default('ubuntu', true) }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('../sp-k8s.pem', true) }}"
        ansible_become: true
        ansible_become_method: sudo
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

        # Replica Set Configuration
        replica_set_name: "{{ lookup('env', 'REPLICA_SET_NAME') | default('rs0', true) }}"
        cluster_type: replica_set

        # MongoDB Configuration
        mongodb_version: "{{ lookup('env', 'MONGODB_VERSION') | default('8.0.17-ent', true) }}"
        mongodb_port: "{{ lookup('env', 'MONGODB_PORT') | default('27017', true) | int }}"
        mongodb_data_path: "{{ lookup('env', 'MONGODB_DATA_PATH') | default('/data/db', true) }}"
        mongodb_log_path: "{{ lookup('env', 'MONGODB_LOG_PATH') | default('/var/log/mongodb', true) }}"

        # Ops Manager Configuration (from environment - REQUIRED)
        ops_manager_url: "{{ lookup('env', 'OPS_MANAGER_URL') }}"
        ops_manager_host: "{{ lookup('env', 'OPS_MANAGER_HOST') }}"
        ops_manager_project_id: "{{ lookup('env', 'OPS_MANAGER_PROJECT_ID') }}"
        ops_manager_org_id: "{{ lookup('env', 'OPS_MANAGER_ORG_ID') }}"
        ops_manager_agent_api_key: "{{ lookup('env', 'OPS_MANAGER_AGENT_API_KEY') }}"
        ops_manager_api_version: "{{ lookup('env', 'OPS_MANAGER_API_VERSION') | default('v1.0', true) }}"

        # Feature Flags
        enable_authentication: "{{ lookup('env', 'ENABLE_AUTHENTICATION') | default('true', true) }}"
        auth_mechanism: SCRAM-SHA-256
        enable_monitoring: "{{ lookup('env', 'ENABLE_MONITORING') | default('true', true) }}"
        enable_backup: "{{ lookup('env', 'ENABLE_BACKUP') | default('true', true) }}"

        # OS Configuration
        os_type: "{{ lookup('env', 'OS_TYPE') | default('ubuntu', true) }}"
        os_version: "{{ lookup('env', 'OS_VERSION') | default('22', true) }}"
