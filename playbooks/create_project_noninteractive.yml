---
- name: Create MongoDB Ops Manager Project (Non-Interactive)
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    # Override these variables when running the playbook
    org_id: ""  # Required: Pass via -e "org_id=YOUR_ORG_ID"
    project_name: "MyMongoDB Project"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
          - org_id is defined
          - org_id | length > 0
          - project_name is defined
        fail_msg: "Please provide org_id via -e org_id=YOUR_ORG_ID and configure ops_manager credentials"

    - name: Prepare project creation payload
      ansible.builtin.set_fact:
        project_payload:
          name: "{{ project_name }}"
          orgId: "{{ org_id }}"

    - name: Create project in Ops Manager
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/groups"
        method: POST
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body: "{{ project_payload | to_json }}"
        body_format: json
        status_code: 201
        return_content: true
      register: project_result

    - name: Display project creation result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "PROJECT CREATED SUCCESSFULLY!"
          - "=========================================="
          - ""
          - "Project ID: {{ project_result.json.id }}"
          - "Project Name: {{ project_result.json.name }}"
          - "Organization ID: {{ project_result.json.orgId }}"
          - ""
          - "Agent API Key (SAVE THIS!):"
          - "  {{ project_result.json.agentApiKey }}"
          - ""
          - "File saved: ./project_{{ project_result.json.id }}_details.txt"
          - "=========================================="

    - name: Save project details to file
      ansible.builtin.copy:
        content: |
          Project Details:
          ================
          Project ID: {{ project_result.json.id }}
          Project Name: {{ project_result.json.name }}
          Agent API Key: {{ project_result.json.agentApiKey }}
          Organization ID: {{ project_result.json.orgId }}
          Created: {{ ansible_date_time.iso8601 }}
          
          Full Response:
          {{ project_result.json | to_nice_json }}
        dest: "./project_{{ project_result.json.id }}_details.txt"
      delegate_to: localhost
