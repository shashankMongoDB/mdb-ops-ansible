---
- name: List All Users in Organization
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  vars_prompt:
    - name: org_id
      prompt: "Enter the Organization ID"
      private: false

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ops_manager_url is defined
          - ops_manager_public_key is defined
          - ops_manager_private_key is defined
          - org_id is defined
          - org_id | length > 0
        fail_msg: "Please configure ops_manager credentials and provide org_id"

    - name: Get all users in organization
      ansible.builtin.uri:
        url: "{{ ops_manager_url }}/api/public/{{ ops_manager_api_version }}/orgs/{{ org_id }}/users"
        method: GET
        user: "{{ ops_manager_public_key }}"
        password: "{{ ops_manager_private_key }}"
        force_basic_auth: false
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: true
      register: users_result

    - name: Display header
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "USERS IN ORGANIZATION {{ org_id }}"
          - "=========================================="
          - "Total Users: {{ users_result.json.totalCount }}"
          - ""

    - name: Display each user
      ansible.builtin.debug:
        msg:
          - "{{ '%02d' | format(idx + 1) }}. {{ item.username }} ({{ item.emailAddress }})"
          - "    User ID: {{ item.id }}"
          - "    Name: {{ item.firstName | default('') }} {{ item.lastName | default('') }}"
          - "    Roles: {{ item.roles | length }} role(s)"
      loop: "{{ users_result.json.results }}"
      loop_control:
        index_var: idx
        label: "{{ item.username }}"

    - name: Display instructions
      ansible.builtin.debug:
        msg:
          - ""
          - "=========================================="
          - "WHAT TO DO NEXT:"
          - "=========================================="
          - ""
          - "IF you DON'T see your username above:"
          - "  → Your user is NOT in this organization"
          - "  → Get your User ID:"
          - "    ansible-playbook playbooks/get_user_id.yml"
          - "  → Add yourself to org:"
          - "    ansible-playbook playbooks/add_user_to_org.yml"
          - "    (Use role: ORG_OWNER)"
          - ""
          - "IF you SEE your username above:"
          - "  → Copy your User ID from above"
          - "  → Organization should be visible in dashboard"
          - "  → If not visible, check your role is ORG_OWNER"
          - ""
          - "=========================================="

    - name: Save detailed user list to file
      ansible.builtin.copy:
        content: |
          Users in Organization {{ org_id }}
          ===================================
          Generated: {{ ansible_date_time.iso8601 }}
          Total Users: {{ users_result.json.totalCount }}
          
          {% for user in users_result.json.results %}
          {{ loop.index }}. {{ user.username }}
          --------------------------------
          User ID: {{ user.id }}
          Email: {{ user.emailAddress }}
          First Name: {{ user.firstName | default('N/A') }}
          Last Name: {{ user.lastName | default('N/A') }}
          Mobile: {{ user.mobileNumber | default('N/A') }}
          
          Roles ({{ user.roles | length }}):
          {% for role in user.roles %}
            - {{ role.roleName }}
          {% if role.orgId is defined %}    Org ID: {{ role.orgId }}{% endif %}
          {% if role.groupId is defined %}    Project ID: {{ role.groupId }}{% endif %}
          {% endfor %}
          
          {% endfor %}
        dest: "./org_{{ org_id }}_users.txt"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - ""
          - "✓ User list saved to: ./org_{{ org_id }}_users.txt"
          - ""
          - "Next step: Find YOUR username in the list above"
          - "Then use get_user_id.yml or add_user_to_org.yml"
